<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .lbl{font-size:14px;fill:#0E1B2A;font-weight:600}
      .sub{font-size:11.5px;fill:#33465a}
      .tech{font-size:11px;fill:#0a5f59;font-family:'IBM Plex Mono',monospace}
      .eyebrow{font-size:11px;fill:#0a5f59;letter-spacing:.14em;font-weight:600}
      .flow{stroke:#0E8F86;stroke-width:2.2;fill:none;marker-end:url(#arw)}
      .loop{stroke:#B9761F;stroke-width:2.2;fill:none;marker-end:url(#arwA)}
      .opt{stroke:#6B7B8C;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#arwG)}
      .note{font-size:11.5px;fill:#6B7B8C}
      .flowlbl{font-size:11px;font-weight:600}
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0E8F86"/></marker>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9761F"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7B8C"/></marker>
  </defs>

  <rect width="1180" height="860" fill="#F5F7F9"/>
  <text x="48" y="50" class="eyebrow">MENDED SKIN · THE REFERRAL DESK</text>
  <text x="48" y="78" style="font-size:23px;fill:#0E1B2A;font-weight:700;font-family:Fraunces,Georgia,serif">System architecture</text>
  <text x="48" y="101" class="note">Taskmaster track · AI interprets, deterministic rules decide, state persists to Google Cloud · closed loop with the patient.</text>

  <!-- Top row: Patient -> Cloud Run -> Orchestrator -->
  <rect x="48" y="140" width="150" height="72" rx="12" fill="#fff" stroke="#DCE3EA" stroke-width="1.5"/>
  <text x="123" y="172" text-anchor="middle" class="lbl">Patient</text>
  <text x="123" y="192" text-anchor="middle" class="sub">text + photo + location</text>

  <rect x="238" y="126" width="250" height="100" rx="14" fill="#F5FBFA" stroke="#bfe4df" stroke-width="1.5"/>
  <text x="256" y="150" class="tech">Google Cloud Run</text>
  <rect x="258" y="160" width="210" height="56" rx="10" fill="#fff" stroke="#DCE3EA" stroke-width="1.5"/>
  <text x="363" y="184" text-anchor="middle" class="lbl">FastAPI service</text>
  <text x="363" y="203" text-anchor="middle" class="sub">Web UI · POST /cases · /reply</text>

  <rect x="528" y="126" width="270" height="100" rx="14" fill="#fff" stroke="#DCE3EA" stroke-width="1.5"/>
  <text x="546" y="150" class="tech">Deterministic orchestrator (pipeline.py)</text>
  <text x="663" y="180" text-anchor="middle" class="lbl">Workflow state machine</text>
  <text x="663" y="200" text-anchor="middle" class="sub">one tool per step · writes state after each</text>

  <path class="flow" d="M198 176 H236"/>
  <path class="flow" d="M488 176 H526"/>

  <!-- Pipeline row -->

  <rect x="48" y="320" width="196" height="92" rx="12" fill="#EAF4FF" stroke="#bcd7f2" stroke-width="1.5"/>
  <text x="146" y="350" text-anchor="middle" class="lbl">extract_case</text>
  <text x="146" y="370" text-anchor="middle" class="sub">free text → structured JSON</text>
  <text x="146" y="392" text-anchor="middle" class="tech">Gemini 3.5 Flash</text>

  <rect x="268" y="320" width="196" height="92" rx="12" fill="#EAF4FF" stroke="#bcd7f2" stroke-width="1.5"/>
  <text x="366" y="350" text-anchor="middle" class="lbl">check_photo_quality</text>
  <text x="366" y="370" text-anchor="middle" class="sub">usable? (non-clinical)</text>
  <text x="366" y="392" text-anchor="middle" class="tech">Gemini 3.5 Flash · multimodal</text>

  <!-- Decision diamond -->
  <polygon points="586,320 686,366 586,412 486,366" fill="#FBF6EC" stroke="#ecd6ad" stroke-width="1.5"/>
  <text x="586" y="360" text-anchor="middle" class="lbl">check_</text>
  <text x="586" y="378" text-anchor="middle" class="lbl">completeness</text>
  <text x="586" y="398" text-anchor="middle" class="tech">deterministic</text>

  <rect x="742" y="320" width="150" height="92" rx="12" fill="#FBF6EC" stroke="#ecd6ad" stroke-width="1.5"/>
  <text x="817" y="356" text-anchor="middle" class="lbl">route_case</text>
  <text x="817" y="376" text-anchor="middle" class="sub">generic queue</text>
  <text x="817" y="396" text-anchor="middle" class="tech">deterministic</text>

  <rect x="916" y="320" width="216" height="92" rx="12" fill="#EAF4FF" stroke="#bcd7f2" stroke-width="1.5"/>
  <text x="1024" y="350" text-anchor="middle" class="lbl">create_referral_packet</text>
  <text x="1024" y="370" text-anchor="middle" class="sub">human-readable summary</text>
  <text x="1024" y="392" text-anchor="middle" class="tech">Gemini 3.5 Flash</text>

  <!-- orchestrator into pipeline -->
  <path class="flow" d="M560 226 C300 250, 160 280, 146 320"/>
  <!-- chain -->
  <path class="flow" d="M244 366 H268"/>
  <path class="flow" d="M464 366 H486"/>
  <!-- complete branch -->
  <path class="flow" d="M686 366 H742"/>
  <text x="700" y="356" class="flowlbl" fill="#0a5f59">complete</text>
  <path class="flow" d="M892 366 H916"/>

  <!-- MISSING branch -> follow-up -> loop to patient -->
  <rect x="486" y="470" width="230" height="80" rx="12" fill="#FBF3E6" stroke="#ecd6ad" stroke-width="1.5"/>
  <text x="601" y="502" text-anchor="middle" class="lbl">Follow-up drafted</text>
  <text x="601" y="522" text-anchor="middle" class="sub">autonomous · lists what's missing</text>
  <text x="601" y="540" text-anchor="middle" class="tech">state: NEEDS_INFORMATION</text>

  <path class="loop" d="M586 412 V470"/>
  <text x="596" y="446" class="flowlbl" fill="#B9761F">missing</text>

  <!-- follow-up curves up and back to the patient -->
  <path class="loop" d="M486 494 C300 494, 150 470, 138 214"/>
  <text x="214" y="296" class="flowlbl" fill="#B9761F">asks patient</text>
  <text x="214" y="311" class="flowlbl" fill="#B9761F">for missing info</text>

  <!-- patient reply re-enters the pipeline at extract_case -->
  <path class="loop" d="M96 212 C40 260, 40 300, 90 320"/>
  <text x="14" y="272" class="flowlbl" fill="#B9761F">reply</text>
  <text x="8" y="287" class="flowlbl" fill="#B9761F">re-enters</text>

  <!-- Firestore -->
  <rect x="486" y="640" width="300" height="92" rx="14" fill="#F5FBFA" stroke="#bfe4df" stroke-width="1.5"/>
  <text x="504" y="666" class="tech">Google Cloud Firestore</text>
  <text x="636" y="694" text-anchor="middle" class="lbl">Case + state + audit trail</text>
  <text x="636" y="714" text-anchor="middle" class="sub">every transition persisted = operational evidence</text>

  <path class="flow" d="M1024 412 C1024 560, 800 620, 786 660"/>
  <path class="flow" d="M601 550 V640"/>
  <text x="612" y="600" class="note">state written after every step</text>

  <!-- ADK optional -->
  <rect x="820" y="470" width="312" height="80" rx="14" fill="#fff" stroke="#DCE3EA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="838" y="496" class="tech">Google ADK agent — optional</text>
  <text x="976" y="522" text-anchor="middle" class="lbl">LlmAgent over the same 5 tools</text>
  <text x="976" y="540" text-anchor="middle" class="sub">shown in ADK dev UI · adk web / adk run</text>
  <path class="opt" d="M976 470 C900 440, 720 420, 686 388"/>

  <!-- Legend -->
  <text x="48" y="800" class="note">Legend:  ■ blue = Gemini (interpretation)   ■ amber = deterministic (decisions)   ■ green = Google Cloud   ⟳ amber line = patient feedback loop   ⇢ dashed = optional</text>
</svg>
